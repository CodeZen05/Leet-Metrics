<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leet Metrics</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Leet Metrics</h1>

      <div class="user-container" >
        <p>Enter Your Username</p>

        <div class="user-input-conatiner">
          <input type="text" placeholder="Username" id="user-input" />
          <button id="search-btn">Search</button>
        </div>
      </div>

      <div class="stat-container" >
        <div class="progress">
          <div class="progress-item">
            <div class="easy-progress circle">
              <span id="easy-label"></span>
              <p>Easy</p>
            </div>
          </div>

          <div class="progress-item">
            <div class="Med-progress circle">
              <span id="Med-label"></span>
              <p>Med</p>
            </div>
          </div>

          <div class="progress-item">
            <div class="hard-progress circle">
              <span id="hard-label"></span>
              <p>Hard</p>
            </div>
          </div>
        </div>

        <div class="stats-card-container">
          <!-- directly populate from the js -->
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
